<script>
    // Uzay Arka Plan Animasyonu (JavaScript)
    const canvas = document.getElementById('space-canvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    let stars = [];
    let meteors = [];

    function resizeCanvas() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Yıldız Sınıfı
    class Star {
        constructor() {
            this.reset();
        }

        reset() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.size = Math.random() * 2;
            this.alpha = Math.random();
            this.alphaSpeed = 0.005 + Math.random() * 0.015;
            this.speedY = 0.05 + Math.random() * 0.15; // Yavaşça aşağı kayma
        }

        update() {
            // Yıldızların parıldama efekti
            this.alpha += this.alphaSpeed;
            if (this.alpha <= 0 || this.alpha >= 1) {
                this.alphaSpeed = -this.alphaSpeed;
            }

            // Derinlik hissi için hafif aşağı kayma
            this.y += this.speedY;
            if (this.y > height) {
                this.y = 0;
                this.x = Math.random() * width;
            }
        }

        draw() {
            ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(this.alpha)})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // Meteor (Kayan Yıldız) Sınıfı
    class Meteor {
        constructor() {
            this.reset();
        }

        reset() {
            this.x = Math.random() * width * 1.5;
            this.y = -50;
            this.length = 80 + Math.random() * 100;
            this.speed = 8 + Math.random() * 10;
            this.size = 1 + Math.random() * 1.5;
            this.active = false;
        }

        update() {
            if (!this.active) {
                if (Math.random() < 0.005) { // Rastgele belirme şansı
                    this.active = true;
                }
                return;
            }

            this.x -= this.speed;
            this.y += this.speed;

            if (this.x < -100 || this.y > height + 100) {
                this.reset();
            }
        }

        draw() {
            if (!this.active) return;

            let gradient = ctx.createLinearGradient(
                this.x, this.y, 
                this.x + this.length, this.y - this.length
            );
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.3, 'rgba(88, 101, 242, 0.6)');
            gradient.addColorStop(1, 'transparent');

            ctx.strokeStyle = gradient;
            ctx.lineWidth = this.size;
            ctx.beginPath();
            ctx.moveTo(this.x, this.y);
            ctx.lineTo(this.x + this.length, this.y - this.length);
            ctx.stroke();
        }
    }

    // Yıldızları ve meteorları oluştur
    for (let i = 0; i < 150; i++) {
        stars.push(new Star());
    }

    for (let i = 0; i < 3; i++) {
        meteors.push(new Meteor());
    }

    // Animasyon Döngüsü
    function animate() {
        // Arka planı temizle ve uzay hissi veren hafif bir nebula gradyanı çiz
        let bgGradient = ctx.createRadialGradient(
            width / 2, height / 2, 10,
            width / 2, height / 2, Math.max(width, height)
        );
        bgGradient.addColorStop(0, '#0f0c1b');
        bgGradient.addColorStop(0.5, '#080612');
        bgGradient.addColorStop(1, '#020205');
        
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, width, height);

        // Yıldızları güncelle ve çiz
        stars.forEach(star => {
            star.update();
            star.draw();
        });

        // Meteorları güncelle ve çiz
        meteors.forEach(meteor => {
            meteor.update();
            meteor.draw();
        });

        requestAnimationFrame(animate);
    }

    animate();
</script>
